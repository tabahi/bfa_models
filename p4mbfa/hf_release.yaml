# The models published on Hugging Face: which training checkpoint each one is, and why.
#
#   python p4mbfa/export_hf.py release              # build out_dir/<name>/ for every model below
#   python p4mbfa/export_hf.py push --dry-run       # list what would be uploaded, upload nothing
#   python p4mbfa/export_hf.py push                 # create/update <namespace>/<name> on the Hub
#
# Each <name> is both the folder under out_dir and the Hub repo name. A release folder holds
# model.safetensors + config.json (what inference.MbfaAligner loads), a README.md model card
# (written only if absent, so hand edits survive a rebuild) and ckpt/<ckpt_name>, the training
# checkpoint renamed, for fine-tuning with train_mbfa.py (`ckpt_path:`).
#
# trained_langs: the FLEURS languages in the training data (data.md); the model card's language
# tags. standard_g2p's group has more members (config.json labels.member_langs).
#
# Selection (2026-10-08, numbers from the local wandb history):
#   noise   - TIMIT is clean studio speech, so it favours models trained with little noise.
#             Never publish a checkpoint trained without noise; among the rest, the one trained
#             with the MOST noise (noise_level) wins, ranked on validation within that level. One
#             latin model is kept as the best-on-TIMIT benchmark regardless of noise.
#   latin   - TIMIT boundary f1@25ms, the only real boundary benchmark (tune half selects).
#             mbfa-latin: the best checkpoint at the highest noise (0.05): ma04a e6, 71.22 tune
#             (ma04a e9 71.21, ma02c e9 71.18, ma02b e5 70.85; all within ~0.1 on holdout).
#             mbfa-latin-benchmark: the best TIMIT of every latin run, ma02a e8 at noise 0.02.
#   others  - FLEURS val_loss, measured against the model's own alignments (no boundary labels
#             outside English), so a weaker guide; the frame accuracies are reported next to it.
#             One run each, all at noise 0.02 (no noise-0.05 run exists for these groups yet).
#   CUPE-3-* - the p3cupe (CUPE v3) models, see their entries.
#
# suite: p4mbfa (export_hf.export) or p3cupe (p3cupe/export_hf.py, which also needs
# decoder_overrides: the decoder the checkpoint was scored with, where it differs from training).

out_dir: tmp/training/selected_models_for_hf
namespace: Tabahi

models:
  mbfa-latin:
    suite: p4mbfa
    checkpoint: tmp/training/p4mbfa/ma04a/m_ma04a_epoch=6_step=6846_val_timit_tune_f1_25ms=71.2195.ckpt
    ckpt_name: latin_fleurs273h_ma04a_e6_timit_f1_25ms=71.22.ckpt
    trained_langs: [af, az, bs, ca, cs, cy, da, de, en-US, es-419, et, fi, fil, fr, ga, gl, hu, id, is, it, lb, lt, mi, ms, mt, nb, nl, pl, pt-BR, ro, sk, sl, sv, sw, tr, uz]
    train_data: "FLEURS latin, all 273.5 h, training noise_level 0.05 (~26 dB SNR)"
    selected_on: "TIMIT f1@25ms on the tune half of the 400-clip probe, best of the noise-0.05 latin runs"
    metrics:
      timit_f1_25ms_tune: 71.22
      timit_f1_25ms_holdout: 71.70
      timit_f1_25ms_nobonus_holdout: 65.21
      timit_f1_10ms_holdout: 53.99
      timit_abs_err_ms_holdout: 16.13
    note: >-
      The recommended latin model: trained with the most noise of any latin run (0.05), for real
      recordings. Continued from ma02a's final epoch (ramp_frames 1.0). TIMIT is clean speech, so
      it scores lower there than mbfa-latin-benchmark (72.93 holdout), which trained at noise 0.02.

  mbfa-latin-benchmark:
