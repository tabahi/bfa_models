  # p3cupe (CUPE v3, ph66 labels), superseded by p4mbfa; published for BFA's ph66 pipeline.
  # All 68 files of the 22 p3cupe runs strict-load into the current p3cupe CupeCNN (2026-10-11).
  # Every p3cupe checkpoint trained at noise_level 0.01, so noise does not separate them.
  # All re-scored with the final decoder (decoder_sweep.py on CPU, min 6 + soft 10 + bonus 30),
  # TIMIT lev f1@25 tune / holdout:
  #   pa01d e3 76.20 / 76.00   e0 75.88 / 76.04    libri_500h, hard-EM   -> CUPE-3-en-base
  #   pa07f e0 76.10 / 75.58                       libri_500h            -> CUPE-3-en
  #   pa07c e2 75.88 / 75.87   e0 75.80 / 75.81    libri_500h, not published (within noise of both)
  #   pc01a e0 75.20 / 74.73   e2 75.10 / 74.76    the final recipe, warm from pa07f
  #   pa07a e0 74.79 / 74.15   e1 73.31 / 73.74   final e4 70.96 / 71.70   MLS_7l_100h -> CUPE-3-mls7
  # pa01d and pa07c were restored on 2026-10-11, after CUPE-3-en was picked: pa01d e3 now leads
  # on both halves (and per phone), but 0.1 on tune is inside the noise, so CUPE-3-en stays.
  # pa07a is the only MLS_7l_100h run. The other multilingual run, pa09a (mswc38), is the
  # soft_target_mix 1.0 collapse; not published.
  CUPE-3-en:
    suite: p3cupe
    checkpoint: tmp/training/p3cupe/pa07f/m_pa07f_epoch=0_step=1246_val_timit_nobonus_f1_25ms=73.4052.ckpt
    ckpt_name: en_libri500_pa07f_e0_timit_f1_25ms=75.58.ckpt
    trained_langs: [en]
    train_data: "LibriSpeech, libri_500h (~497 h), one epoch, training noise_level 0.01"
    selected_on: "TIMIT lev f1@25ms on the tune half, re-scored with the final decoder"
    decoder_overrides: {min_phone_frames: 6}     # trained with min 3; min 6 decodes better
    metrics:
      timit_lev_f1_25ms_tune: 76.10
      timit_lev_f1_25ms_holdout: 75.58
      timit_lev_f1_25ms_bonus0_holdout: 73.77
      timit_phone_hit_25ms_bonus0_holdout: 73.07
      timit_phone_hit_25ms_holdout: 68.73
    note: >-
      Warm-started from pa07e; the lineage is pa01d -> pa07a (MLS, 7 languages, 100 h) ->
      pa07b (libri_360h) -> pa07c, pa07d, pa07e (libri_500h) -> pa07f. Trained with
      min_phone_frames 3, soft 10, onset bonus 30, ramp 3. For per-phone onset accuracy decode
      with boundary_bonus_weight 0 (phone_hit 73.07 vs 68.73).

  CUPE-3-en-base:
    suite: p3cupe
    checkpoint: tmp/training/p3cupe/pa01d/m_pa01d_epoch=3_step=4984_val_timit_sub_f1_25ms=75.9831.ckpt
    ckpt_name: en_libri500_pa01d_e3_timit_f1_25ms=76.00.ckpt
    trained_langs: [en]
    train_data: "LibriSpeech, libri_500h (~497 h), 4 epochs, training noise_level 0.01"
    selected_on: "TIMIT lev f1@25ms on the tune half, re-scored with the final decoder"
    decoder_overrides: {soft_phone_frames: 10}   # trained with soft 4; soft 10 decodes better
    metrics:
      timit_lev_f1_25ms_tune: 76.20
      timit_lev_f1_25ms_holdout: 76.00
      timit_lev_f1_25ms_bonus0_holdout: 73.80
      timit_phone_hit_25ms_bonus0_holdout: 74.63
      timit_phone_hit_25ms_holdout: 68.63
    note: >-
      The root of the p3cupe lineage (pa01c -> pa01d): plain hard-EM targets, min_phone_frames 6,
      soft 4, onset bonus 30, ramp 3, trained before the soft_target_mix runs that CUPE-3-en
      descends from. The best TIMIT score of every p3cupe run, by a margin inside the noise
      (CUPE-3-en: 76.10 tune / 75.58 holdout). For per-phone onset accuracy decode with
      boundary_bonus_weight 0 (phone_hit 74.63 vs 68.63). CUPE-3-mls7 was warm-started from
      this checkpoint.

  CUPE-3-mls7:
    # Epoch 0 of 4: the run falls on TIMIT every epoch (soft_target_mix 1.0, the drift recipe),
    # so the first epoch is both the monitor's pick and the best re-scored.
    suite: p3cupe
    checkpoint: tmp/training/p3cupe/pa07a/m_pa07a_epoch=0_step=1615_val_timit_nobonus_f1_25ms=71.4390.ckpt
    ckpt_name: mls7_mls700h_pa07a_e0_timit_f1_25ms=74.15.ckpt
    trained_langs: [de, es, fr, it, nl, pl, pt]
    train_data: "Multilingual LibriSpeech, MLS_7l_100h: 100 h each of German, Spanish, French, Italian, Dutch, Polish and Portuguese (700 h, no English), one epoch, training noise_level 0.01"
    selected_on: "TIMIT lev f1@25ms on the tune half, re-scored with the final decoder (best of the run's three saved checkpoints)"
    decoder_overrides: {soft_phone_frames: 10}   # trained with soft 4; soft 10 decodes better on tune
    metrics:
      timit_lev_f1_25ms_tune: 74.79
      timit_lev_f1_25ms_holdout: 74.15
      timit_lev_f1_25ms_bonus0_holdout: 70.89
      timit_phone_hit_25ms_bonus0_holdout: 71.11
      timit_phone_hit_25ms_holdout: 66.41
    note: >-
      The only multilingual CUPE v3: the English CUPE-3-en-base (pa01d epoch 3) trained one more
      epoch on seven non-English MLS languages, with soft targets (soft_target_mix 1.0),
      min_phone_frames 6, soft 4, onset bonus 30, ramp 3. There are no boundary labels outside
      English, so the scores below are English TIMIT: they show how much English boundary
      accuracy survived (76.00 -> 74.15 holdout), not how well the seven languages align. Later
      epochs of this run kept falling on TIMIT (73.74 at epoch 1, 71.70 at epoch 4), so they
      are not published.

