    ckpt_name: cyrillic_fleurs40h_mr01a_e10_val_loss=2.652.ckpt
    trained_langs: [be, bg, hr, kk, mk, ru, sr, uk]
    train_data: "FLEURS cyrillic, a 62% sample (train_limit 100000): ~40 of 65.1 h, training noise_level 0.02"
